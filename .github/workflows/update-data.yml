name: Update flight data

# Keeps data/flights.json fresh so the dashboard has live-ish data even
# when it's just hosted as a static site (e.g. GitHub Pages), with no
# stream running. The live-stream workflow polls OpenSky itself at a
# faster interval and does not depend on this workflow.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub's practical minimum cadence)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest OpenSky snapshot
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: node scripts/fetch-flights.js

      - name: Commit snapshot
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/flights.json
          git diff --staged --quiet || git commit -m "chore: refresh flight snapshot [skip ci]"
          git push
